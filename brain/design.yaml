version: "1.0"
project: "Ultra Browser"
inspiration: "Claude Browser"
aesthetic: "Minimalist Soft"

design_system:
  tokens:
    colors:
      primary: "#3B82F6"      # Blue 500
      primary_soft: "#60A5FA" # Blue 400
      primary_light: "#EFF6FF" # Blue 50
      
      surface: "#FFFFFF"
      background: "#F9FAFB"  # Gray 50
      
      text_main: "#1F2937"   # Gray 800
      text_muted: "#6B7280"  # Gray 500
      
      border: "#E5E7EB"      # Gray 200
      border_light: "#F3F4F6" # Gray 100
      
      status_thinking: "#93C5FD" # Blue 300
      status_success: "#10B981"  # Emerald 500
      status_error: "#EF4444"    # Red 500
      
      model_gemini: "#4285F4"
      model_anthropic: "#D97706"
      model_openai: "#10A37F"

    typography:
      font_family: "'Inter', system-ui, -apple-system, sans-serif"
      sizes:
        xs: "12px"
        sm: "14px"    # Base size for side panel
        base: "16px"
        lg: "18px"
      weights:
        normal: "400"
        medium: "500"
        semibold: "600"

    spacing:
      unit: "4px"
      scale:
        1: "4px"
        2: "8px"
        3: "12px"
        4: "16px"
        6: "24px"
        8: "32px"

    effects:
      roundness:
        sm: "4px"
        md: "8px"
        lg: "12px"
        xl: "16px"
        full: "9999px"
      shadows:
        sm: "0 1px 2px 0 rgba(0, 0, 0, 0.05)"
        md: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)"
        inner: "inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)"

  components:
    layout:
      side_panel:
        max_width: "450px"
        min_width: "300px"
        bg: "var(--color-background)"
    
    chat:
      user_bubble:
        bg: "var(--color-border-light)"
        text: "var(--color-text-main)"
        radius: "var(--radius-xl) var(--radius-xl) var(--radius-sm) var(--radius-xl)"
      ai_bubble:
        bg: "var(--color-surface)"
        border: "1px solid var(--color-border-light)"
        text: "var(--color-text-main)"
        radius: "var(--radius-xl) var(--radius-xl) var(--radius-xl) var(--radius-sm)"
        shadow: "var(--shadow-sm)"
      
    feedback:
      thinking:
        animation: "pulse 2s infinite"
        color: "var(--color-status-thinking)"
        font_style: "italic"
      tool_execution:
        bg: "var(--color-primary-light)"
        border: "1px solid var(--color-primary-soft)"
        text: "var(--color-primary)"
        icon_size: "14px"

    input_area:
      container:
        bg: "var(--color-surface)"
        border: "1px solid var(--color-border)"
        radius: "var(--radius-xl)"
        shadow: "var(--shadow-sm)"
      
      model_selector:
        position: "top or bottom of input"
        icon_size: "20px"
        active_bg: "var(--color-primary-light)"
        
      addition_menu:
        trigger_size: "32px"
        popover_bg: "var(--color-surface)"
        popover_shadow: "var(--shadow-md)"
        popover_radius: "var(--radius-lg)"
        
      attachment_preview:
        item_size: "48px"
        gap: "8px"
        limit: 10
        remove_bg: "var(--color-status-error)"

      flat_mode:
        badge_bg: "var(--color-primary-light)"
        badge_text: "var(--color-primary)"

  accessibility:
    contrast_ratio: "4.5:1 (Minimum for text)"
    focus_ring: "2px solid var(--color-primary-soft)"
    touch_targets: "Min 44x44px where applicable"

css_variables: |
  :root {
    --color-primary: #3B82F6;
    --color-primary-soft: #60A5FA;
    --color-primary-light: #EFF6FF;
    --color-surface: #FFFFFF;
    --color-background: #F9FAFB;
    --color-text-main: #1F2937;
    --color-text-muted: #6B7280;
    --color-border: #E5E7EB;
    --color-border-light: #F3F4F6;
    --color-status-thinking: #93C5FD;
    --color-status-success: #10B981;
    --color-status-error: #EF4444;
    
    --color-model-gemini: #4285F4;
    --color-model-anthropic: #D97706;
    --color-model-openai: #10A37F;
    
    --font-main: 'Inter', sans-serif;
    
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
